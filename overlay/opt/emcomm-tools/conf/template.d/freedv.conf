# EmComm Tools seed configuration for FreeDV (wxFileConfig INI).
#
# et-freedv copies this to ~/.config/freedv/freedv.conf on first run only, filling
# in the ET_CALLSIGN / ET_GRID / ET_RADIO_IN / ET_RADIO_OUT placeholders. After that
# FreeDV owns the file (it rewrites it on exit) and et-freedv only refreshes the
# dynamic keys below. The headset (sound card 2) is chosen by the operator, never here.
[Hamlib]
UseForPTT=1
RigNameStr=Hamlib NET rigctl
SerialPort=localhost:4532
SerialRate=0
PttType=0

[Rig]
UseSerialPTT=0

[Audio]
soundCard1InDeviceName={{ET_RADIO_IN}}
soundCard1OutDeviceName={{ET_RADIO_OUT}}

[Reporting]
Enable=1
Callsign={{ET_CALLSIGN}}
GridSquare={{ET_GRID}}

[Reporting/FreeDV]
Enable=1
